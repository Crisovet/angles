<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Corresponding Angles Explorer</title>
<style>
:root{--bg:#f6f8fc;--card:#fff;--text:#1d2433;--muted:#5d6678;--a:#2563eb;--b:#ea580c;--line:#334155;--trans:#16a34a;--ok:#15803d;--okbg:#dcfce7;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1420;--card:#1a2132;--text:#eef1f7;--muted:#a3adc2;--a:#60a5fa;--b:#fb923c;--line:#cbd5e1;--trans:#4ade80;--ok:#86efac;--okbg:#14351f}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Trebuchet MS",system-ui,sans-serif;display:flex;justify-content:center}
main{width:100%;max-width:760px;padding:16px}
h1{font-size:1.4rem;margin:4px 0}
p.sub{margin:0 0 12px;color:var(--muted)}
.card{background:var(--card);border-radius:16px;padding:10px;box-shadow:0 2px 10px rgba(0,0,0,.1)}
svg{width:100%;height:auto;touch-action:none;display:block}
svg path{pointer-events:none}
.pairs{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.pairs button{border:2px solid var(--muted);background:var(--card);color:var(--text);border-radius:999px;padding:8px 14px;font-size:.95rem;cursor:pointer}
.pairs button.on{border-color:var(--a);background:var(--a);color:#fff}
.read{display:flex;gap:10px;flex-wrap:wrap}
.chip{flex:1;min-width:140px;border-radius:12px;padding:10px;background:var(--card);font-size:1.1rem;font-weight:bold}
.chip.a{border-left:6px solid var(--a)}.chip.b{border-left:6px solid var(--b)}
#msg{margin-top:12px;padding:12px;border-radius:12px;background:var(--card);font-size:1.05rem;min-height:48px}
#msg.ok{background:var(--okbg);color:var(--ok);font-weight:bold}
.hint{color:var(--muted);font-size:.9rem;margin-top:8px}
</style>
</head>
<body>
<main>
<h1>📐 Corresponding Angles</h1>
<p class="sub">Drag either parallel line (grab it anywhere) up or down. Bring the parallel lines together!</p>
<div class="card">
<svg id="s" viewBox="0 0 700 440" aria-label="Two parallel lines crossed by a transversal"></svg>
</div>
<div class="pairs" id="pairs"></div>
<div class="read">
<div class="chip a">Blue angle: <span id="va"></span>°</div>
<div class="chip b">Orange angle: <span id="vb"></span>°</div>
<div class="chip">Gap: <span id="gap"></span></div>
</div>
<div id="msg"></div>
<div class="hint">Corresponding angles sit in the same spot at each crossing.</div>
</main>
<script>
const NS="http://www.w3.org/2000/svg",svg=document.getElementById("s");
const TH=65,rad=TH*Math.PI/180,CX=350,CY=220,R=58;
const Y_MIN=50,Y_MAX=390;
let yA=130,yB=320,sel=0,drag=null,off=0;
const pairs=[{n:"Top right",a0:0,a1:TH},{n:"Top left",a0:TH,a1:180},{n:"Bottom left",a0:180,a1:180+TH},{n:"Bottom right",a0:180+TH,a1:360}];
const css=v=>"var(--"+v+")";
function el(t,at,p){const e=document.createElementNS(NS,t);for(const k in at)e.setAttribute(k,at[k]);(p||svg).appendChild(e);return e}
const xAt=y=>CX+(CY-y)/Math.tan(rad);
function pt(px,py,a,r){const t=a*Math.PI/180;return[px+r*Math.cos(t),py-r*Math.sin(t)]}
function wedge(px,py,a0,a1,r){
 const [x0,y0]=pt(px,py,a0,r),[x1,y1]=pt(px,py,a1,r);
 const large=(a1-a0)>180?1:0;
 return `M${px} ${py} L${x0} ${y0} A${r} ${r} 0 ${large} 0 ${x1} ${y1} Z`}
function draw(){
 svg.innerHTML="";
 const x1=xAt(10),x2=xAt(430);
 el("line",{x1:x1,y1:10,x2:x2,y2:430,stroke:css("trans"),"stroke-width":5,"stroke-linecap":"round"});
 const merged=Math.abs(yA-yB)<4;
 const ys=merged?[yA]:[yA,yB];
 ys.forEach((y,i)=>el("line",{x1:20,y1:y,x2:680,y2:y,stroke:css("line"),"stroke-width":4,"stroke-linecap":"round"}));
 [["a",yA],["b",yB]].forEach(([k,y])=>{
  if(merged&&k==="b")return;
  const h=el("line",{x1:20,y1:y,x2:680,y2:y,stroke:"transparent","stroke-width":28,style:"cursor:ns-resize;pointer-events:stroke"});
  h.addEventListener("pointerdown",e=>{drag=k;off=y-toY(e);e.preventDefault()});
 });
 // arrows marking parallel
 const p=pairs[sel];
 const items=[{y:yB,c:"b",r:R-8},{y:yA,c:"a",r:R}];
 items.forEach(it=>{
  const px=xAt(it.y);
  el("path",{d:wedge(px,it.y,p.a0,p.a1,it.r),fill:css(it.c),"fill-opacity":.45,stroke:css(it.c),"stroke-width":3});
 });
 [[yA,"a"],[yB,"b"]].forEach(([y,c])=>{
  const px=xAt(y);
  el("circle",{cx:px,cy:y,r:15,fill:css(c),stroke:"#fff","stroke-width":3,style:"cursor:ns-resize"}).dataset.k=c;
  const g=el("text",{x:px,y:y+5,"text-anchor":"middle","font-size":14,"font-weight":"bold",fill:"#fff","pointer-events":"none"});g.textContent="↕";
 });
 svg.querySelectorAll("circle").forEach(c=>c.addEventListener("pointerdown",e=>{drag=c.dataset.k;off=0;c.setPointerCapture&&0;e.preventDefault()}));
 const ang=Math.round(p.a1-p.a0);
 document.getElementById("va").textContent=ang;
 document.getElementById("vb").textContent=ang;
 const gap=Math.round(Math.abs(yA-yB));
 document.getElementById("gap").textContent=merged?"0 (one line!)":gap;
 const m=document.getElementById("msg");
 if(merged){m.className="ok";m.textContent="The two lines became ONE line, so the blue and orange angles sit exactly on top of each other. They are the same size! That is why corresponding angles are equal. ✅"}
 else{m.className="";m.textContent=gap<80?"Almost there! The angles are overlapping more and more...":"Slide a handle toward the other one and watch the angles."}
}
function toY(e){const r=svg.getBoundingClientRect();return Math.max(Y_MIN,Math.min(Y_MAX,(e.clientY-r.top)*440/r.height))}
window.addEventListener("pointermove",e=>{
 if(!drag)return;let y=Math.max(Y_MIN,Math.min(Y_MAX,toY(e)+off));
 if(drag==="a")yA=y;else yB=y;
 if(Math.abs(yA-yB)<8){if(drag==="a")yA=yB;else yB=yA}
 draw()});
window.addEventListener("pointerup",()=>{drag=null});
const pb=document.getElementById("pairs");
pairs.forEach((p,i)=>{const b=document.createElement("button");b.textContent=p.n;b.onclick=()=>{sel=i;[...pb.children].forEach((c,j)=>c.classList.toggle("on",j===i));draw()};if(i===0)b.className="on";pb.appendChild(b)});
draw();
</script>
</body>
</html>

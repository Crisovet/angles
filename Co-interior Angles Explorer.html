<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Co-interior Angles Explorer</title>
<style>
:root{--bg:#f6f8fc;--card:#fff;--text:#1d2433;--muted:#5d6678;--a:#2563eb;--b:#ea580c;--line:#334155;--trans:#16a34a;--strip:#fde68a;--ok:#15803d;--okbg:#dcfce7;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1420;--card:#1a2132;--text:#eef1f7;--muted:#a3adc2;--a:#60a5fa;--b:#fb923c;--line:#cbd5e1;--trans:#4ade80;--strip:#78601a;--ok:#86efac;--okbg:#14351f}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Trebuchet MS",system-ui,sans-serif;display:flex;justify-content:center}
main{width:100%;max-width:760px;padding:16px}
h1{font-size:1.4rem;margin:4px 0}
p.sub{margin:0 0 12px;color:var(--muted)}
.card{background:var(--card);border-radius:16px;padding:10px;box-shadow:0 2px 10px rgba(0,0,0,.1)}
svg{width:100%;height:auto;touch-action:none;display:block}
svg path{pointer-events:none}
.pairs{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.pairs button{border:2px solid var(--muted);background:var(--card);color:var(--text);border-radius:999px;padding:8px 14px;font-size:.95rem;cursor:pointer}
.pairs button.on{border-color:var(--a);background:var(--a);color:#fff}
.read{display:flex;gap:10px;flex-wrap:wrap}
.chip{flex:1;min-width:140px;border-radius:12px;padding:10px;background:var(--card);font-size:1.1rem;font-weight:bold}
.chip.a{border-left:6px solid var(--a)}.chip.b{border-left:6px solid var(--b)}
#msg{margin-top:12px;padding:12px;border-radius:12px;background:var(--card);font-size:1.05rem;min-height:48px}
#msg.ok{background:var(--okbg);color:var(--ok);font-weight:bold}
.hint{color:var(--muted);font-size:.9rem;margin-top:8px}
</style>
</head>
<body>
<main>
<h1>📐 Co-interior Angles</h1>
<p class="sub">Drag either parallel line (grab it anywhere) up or down. Squeeze the yellow strip until the lines meet!</p>
<div class="card">
<svg id="s" viewBox="0 0 700 440" aria-label="Co-interior angles between two parallel lines"></svg>
</div>
<div class="pairs" id="pairs"></div>
<div class="read">
<div class="chip a">Blue angle: <span id="va"></span>°</div>
<div class="chip b">Orange angle: <span id="vb"></span>°</div>
<div class="chip">Sum: <span id="sum"></span>°</div>
<div class="chip">Gap: <span id="gap"></span></div>
</div>
<div id="msg"></div>
<div class="hint">Co-interior angles are between the lines, on the same side of the green line (like a C or U shape).</div>
</main>
<script>
const NS="http://www.w3.org/2000/svg",svg=document.getElementById("s");
const TH=65,rad=TH*Math.PI/180,CX=350,CY=220,R=58;
const Y_MIN=50,Y_MAX=390;
let yA=140,yB=310,sel=0,drag=null,off=0;
// A = upper line (blue wedge below it), B = lower line (orange wedge above it), both on the same side of the green line
const pairs=[
 {n:"Right side",a:[180+TH,360],b:[0,TH],va:180-TH,vb:TH},
 {n:"Left side",a:[180,180+TH],b:[TH,180],va:TH,vb:180-TH}
];
const css=v=>"var(--"+v+")";
function el(t,at){const e=document.createElementNS(NS,t);for(const k in at)e.setAttribute(k,at[k]);svg.appendChild(e);return e}
const xAt=y=>CX+(CY-y)/Math.tan(rad);
function pt(px,py,a,r){const t=a*Math.PI/180;return[px+r*Math.cos(t),py-r*Math.sin(t)]}
function wedge(px,py,a0,a1,r){
 const [x0,y0]=pt(px,py,a0,r),[x1,y1]=pt(px,py,a1,r);
 return `M${px} ${py} L${x0} ${y0} A${r} ${r} 0 ${(a1-a0)>180?1:0} 0 ${x1} ${y1} Z`}
function draw(){
 svg.innerHTML="";
 const merged=yA===yB;
 el("rect",{x:20,y:yA,width:660,height:yB-yA,fill:css("strip"),"fill-opacity":.45});
 el("line",{x1:xAt(10),y1:10,x2:xAt(430),y2:430,stroke:css("trans"),"stroke-width":5,"stroke-linecap":"round"});
 (merged?[yA]:[yA,yB]).forEach(y=>el("line",{x1:20,y1:y,x2:680,y2:y,stroke:css("line"),"stroke-width":4,"stroke-linecap":"round"}));
 [["a",yA],["b",yB]].forEach(([k,y])=>{
  if(merged&&k==="b")return;
  const h=el("line",{x1:20,y1:y,x2:680,y2:y,stroke:"transparent","stroke-width":28,style:"cursor:ns-resize;pointer-events:stroke"});
  h.addEventListener("pointerdown",e=>{drag=merged?"m":k;off=merged?0:y-toY(e);e.preventDefault()});
 });
 const p=pairs[sel];
 const xa=xAt(yA),xb=xAt(yB);
 el("path",{d:wedge(xa,yA,p.a[0],p.a[1],R),fill:css("a"),"fill-opacity":.5,stroke:css("a"),"stroke-width":3});
 el("path",{d:wedge(xb,yB,p.b[0],p.b[1],R),fill:css("b"),"fill-opacity":.5,stroke:css("b"),"stroke-width":3});
 [[yA,"a",xa],[yB,"b",xb]].forEach(([y,c,x])=>{
  const h=el("circle",{cx:x,cy:y,r:15,fill:css(c),stroke:"#fff","stroke-width":3,style:"cursor:ns-resize"});
  h.dataset.k=c;
  h.addEventListener("pointerdown",e=>{drag=c;off=0;e.preventDefault()});
  const g=el("text",{x:x,y:y+5,"text-anchor":"middle","font-size":14,"font-weight":"bold",fill:"#fff","pointer-events":"none"});g.textContent="↕";
 });
 document.getElementById("va").textContent=p.va;
 document.getElementById("vb").textContent=p.vb;
 document.getElementById("sum").textContent=p.va+p.vb;
 const gap=Math.round(yB-yA);
 document.getElementById("gap").textContent=merged?"0 (one line!)":gap;
 const m=document.getElementById("msg");
 if(merged){m.className="ok";m.textContent="The two lines are now ONE line. The blue and orange angles now sit side by side and together make a straight line, which is 180°. So co-interior angles always add up to 180°! ✅"}
 else{m.className="";m.textContent=gap<80?"Getting close! See the two angles sliding next to each other...":"Slide a handle toward the other and watch the angles meet."}
}
function toY(e){const r=svg.getBoundingClientRect();return Math.max(Y_MIN,Math.min(Y_MAX,(e.clientY-r.top)*440/r.height))}
window.addEventListener("pointermove",e=>{
 if(!drag)return;
 let y=Math.max(Y_MIN,Math.min(Y_MAX,toY(e)+off));
 if(drag==="m")drag=y<yA?"a":"b";
 if(drag==="a")yA=Math.min(y,yB);else yB=Math.max(y,yA);
 if(yB-yA<8){if(drag==="a")yA=yB;else yB=yA}
 draw()});
window.addEventListener("pointerup",()=>{drag=null});
const pb=document.getElementById("pairs");
pairs.forEach((p,i)=>{const b=document.createElement("button");b.textContent=p.n;b.onclick=()=>{sel=i;[...pb.children].forEach((c,j)=>c.classList.toggle("on",j===i));draw()};if(i===0)b.className="on";pb.appendChild(b)});
draw();
</script>
</body>
</html>
